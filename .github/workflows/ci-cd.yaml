name: CI/CD Pipeline (Multi-Env)

on:
  push:
    branches: ["dev", "prod"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Centralized Env
  NEXT_PUBLIC_API_URL: ${{ github.ref_name == 'dev' && secrets.DEV_NEXT_PUBLIC_API_URL || secrets.PROD_NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_APP_URL: ${{ github.ref_name == 'dev' && secrets.DEV_NEXT_PUBLIC_APP_URL || secrets.PROD_NEXT_PUBLIC_APP_URL }}
  DOKPLOY_WEBHOOK_URL: ${{ github.ref_name == 'dev' && secrets.DEV_DOKPLOY_WEBHOOK_URL || secrets.PROD_DOKPLOY_WEBHOOK_URL }}

jobs:
  build-and-deploy:
    name: Build & Deploy ${{ github.ref_name == 'dev' && '(Development)' || '(Production)' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: ${{ github.ref_name == 'dev' && 'Build & Push (Development)' || 'Build & Push (Production)' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}

      - name: Trigger Dokploy Webhook (${{ github.ref_name == 'dev' && 'Development' || 'Production' }})
        run: |
          curl -X POST "${{ env.DOKPLOY_WEBHOOK_URL }}"
